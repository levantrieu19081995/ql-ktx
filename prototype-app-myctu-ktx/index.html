<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#174a7e" />
    <title>MyCTU KTX - Prototype giao diện app</title>
    <link rel="stylesheet" href="styles.css?v=3" />
  </head>
  <body>
    <div class="prototype-layout">
      <aside class="screen-map" id="screenMap" aria-label="Danh sách màn hình mẫu">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">CT</div>
          <div>
            <strong>MyCTU KTX</strong>
            <span>Prototype chức năng</span>
          </div>
          <button class="icon-button map-close" id="closeMap" aria-label="Đóng danh sách màn hình">
            <span aria-hidden="true">×</span>
          </button>
        </div>

        <div class="role-switch" aria-label="Chọn vai trò xem mẫu">
          <button type="button" data-role="student" class="role-button is-active">Sinh viên</button>
          <button type="button" data-role="staff" class="role-button">Phòng CTSV</button>
        </div>

        <div class="screen-list" id="screenList"></div>

        <div class="prototype-note">
          <strong>Bản mẫu trình diễn</strong>
          <p>Dữ liệu trong giao diện là dữ liệu minh họa, chưa kết nối hệ thống thật.</p>
        </div>
      </aside>

      <button class="map-backdrop" id="mapBackdrop" aria-label="Đóng danh sách màn hình"></button>

      <main class="device-stage">
        <section class="app-shell" aria-label="Ứng dụng MyCTU KTX">
          <header class="app-header">
            <div class="header-left">
              <button class="icon-button mobile-menu" id="openMap" aria-label="Mở danh sách màn hình">
                <span class="menu-lines" aria-hidden="true"></span>
              </button>
              <button class="icon-button back-button" id="backButton" aria-label="Quay lại" hidden>
                <span aria-hidden="true">←</span>
              </button>
              <div>
                <p class="eyebrow" id="headerEyebrow">MYCTU</p>
                <h1 id="headerTitle">Ký túc xá</h1>
              </div>
            </div>
            <button class="header-action" id="roleBadge" type="button" aria-label="Đổi vai trò xem mẫu">
              <span class="status-dot"></span>
              <span id="roleBadgeText">Sinh viên</span>
            </button>
          </header>

          <div class="app-content" id="appContent" aria-live="polite"></div>
          <nav class="bottom-nav" id="bottomNav" aria-label="Điều hướng chính"></nav>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js?v=3"></script>
  </body>
</html>
